name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m compileall -q env.py gym_env.py demo.py tests
      - name: Run bounded public JSBSim smoke trajectory
        run: python demo.py --steps 12 --seed 42 --output artifacts/trajectory.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-python-${{ matrix.python-version }}
          path: artifacts/trajectory.csv
          if-no-files-found: error
